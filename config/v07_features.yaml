# StockReason v0.7 Features & Targets Configuration
seed: 42

targets:
  horizons: [5, 21]
  enable_126d: false  # Disabled: 126d (6-month) forward returns suffer severe macro regime noise, high sample overlap autocorrelation, and lookahead vulnerability in volatile emerging markets.
  volatility_window: 60
  annualization_factor: 252
  clip_bounds: [-5.0, 5.0]
  normalization_method: "rank"  # "rank" ([-0.5, 0.5]) or "zscore"
  benchmark_col: "nifty_50_close"
  price_col: "adj_close"  # Falls back to "close" if adj_close is absent
  date_col: "date"
  ticker_col: "ticker"

features:
  normalization:
    default_method: "rank"  # "rank" ([-0.5, 0.5]), "zscore", or "none"
  
  stationarity_rules:
    disallowed_prefixes: ["sma_", "ema_", "atr_"]
    disallowed_exact:
      - "open"
      - "high"
      - "low"
      - "close"
      - "adj_close"
      - "volume"
      - "macd_line_12_26"
      - "macd_signal_12_26"
      - "macd_line_8_17"
      - "macd_signal_8_17"
      - "macd_line_5_35"
      - "macd_signal_5_35"
      - "donchian_high_10"
      - "donchian_low_10"
      - "donchian_mid_10"
      - "donchian_high_20"
      - "donchian_low_20"
      - "donchian_mid_20"
      - "bb_upper_10"
      - "bb_lower_10"
      - "bb_mid_10"
      - "bb_upper_20"
      - "bb_lower_20"
      - "bb_mid_20"
      - "bb_upper_50"
      - "bb_lower_50"
      - "bb_mid_50"
      - "keltner_upper_20"
      - "keltner_lower_20"
      - "obv"
      - "obv_ema_20"
      - "pvt"
      - "vol_sma_5"
      - "vol_sma_10"
      - "vol_sma_20"
      - "vol_sma_50"
      - "volume_lag_1"
      - "volume_lag_2"
      - "volume_lag_3"
      - "volume_lag_5"
      - "volume_lag_10"
      - "volume_lag_21"
      - "nifty_50_close"
      - "nifty_bank_close"
      - "nifty_it_close"
      - "vix_close"

ablation:
  active_set: "C"
  model:
    n_estimators: 300
    learning_rate: 0.03
    max_depth: 5
    num_leaves: 31
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
  cv:
    n_splits: 3
    embargo_days: 5  # Purging/embargo to prevent overlap leakage

paths:
  input_parquet: "data/processed/price_features.parquet"
  output_panel: "data/v0.7/panel_v07.parquet"
  importance_output: "artifacts/v0.7/feature_importance.json"
  ablation_results: "artifacts/v0.7/ablation_results.json"
  ablation_report: "reports/v0.7/feature_ablation.md"
  ws5_report: "reports/v0.7/WS5_report.md"
