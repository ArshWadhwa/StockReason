# StockReason v0.8 System Configuration
# Production-Grade Historical Dataset Expansion & Multi-Horizon Modeling
version: "0.8.0"

# Target Specifications
historical_start_date: "2011-11-01"
target_universe_size: 500
price_frequency: "daily"
primary_fields: ["open", "high", "low", "close", "adj_close", "volume"]

# Storage Architecture
storage:
  raw_dir: "data/v0.8/raw"
  raw_prices_dir: "data/v0.8/raw/prices"
  raw_corp_actions_dir: "data/v0.8/raw/corporate_actions"
  raw_universe_dir: "data/v0.8/raw/universe"
  canonical_dir: "data/v0.8/canonical"
  canonical_prices_dir: "data/v0.8/canonical/prices"
  canonical_universe_dir: "data/v0.8/canonical/universe_membership"
  processed_dir: "data/v0.8/processed"
  processed_features_dir: "data/v0.8/processed/features"
  processed_targets_dir: "data/v0.8/processed/targets"
  metadata_dir: "data/v0.8/metadata"
  reports_dir: "reports/v0.8"
  artifacts_dir: "artifacts/v0.8"

# Multi-Horizon Forecasting Setup
horizons: [1, 5, 21, 63, 126]
default_primary_horizon: 21

# Reproducibility Seeds
seeds: [42, 101, 2024, 7, 999]
tree_seeds: [42, 101, 2024]
neural_seeds: [42, 101, 2024, 7, 999]

# Purged Walk-Forward Cross-Validation
cv:
  n_folds: 8
  min_train_ratio: 0.40
  val_ratio: 0.10
  test_ratio: 0.10
  embargo_window: 5
  # Purge window dynamically adapts: purge_window = horizon + embargo_window

# Verified Cost Structure (Indian Equity Delivery, updated Oct 2024 SEBI circular)
costs:
  brokerage_pct: 0.0003          # 0.03% or ₹20 flat
  brokerage_flat_cap: 20.0       # ₹20 max per executed order
  stt_pct: 0.0010                # 0.1% on delivery buy & sell
  exchange_txn_pct: 0.0000297    # 0.00297% NSE cash market turnover (SEBI circular NSE/INVG/63914)
  sebi_turnover_pct: 0.000001    # 0.0001% (₹10 / crore)
  stamp_duty_pct: 0.00015        # 0.015% on buy side only
  gst_pct: 0.18                  # 18% GST on (brokerage + exchange + sebi)
  dp_charges_per_sell: 15.93     # ₹13.50 + 18% GST CDSL depository charge per sell
  slippage_bps: 5.0              # 5 bps one-way baseline slippage
  cost_sensitivity_multipliers: [0.5, 1.0, 1.5, 2.0]

# Frozen Model Configurations
frozen_models:
  ridge:
    alpha: 10.0
    fit_intercept: true
  lightgbm:
    n_estimators: 250
    learning_rate: 0.03
    num_leaves: 31
    min_child_samples: 20
    subsample: 0.8
    colsample_bytree: 0.8
    early_stopping_rounds: 20
    random_state: 42
    n_jobs: 1
  catboost:
    iterations: 250
    learning_rate: 0.03
    depth: 5
    l2_leaf_reg: 3.0
    early_stopping_rounds: 20
    random_seed: 42
    thread_count: 1
    verbose: 0
  lstm:
    hidden_dim: 32
    num_layers: 2
    dropout: 0.2
    learning_rate: 0.002
    batch_size: 128
    epochs: 15
    patience: 4
  gru:
    hidden_dim: 32
    num_layers: 2
    dropout: 0.2
    learning_rate: 0.002
    batch_size: 128
    epochs: 15
    patience: 4
  dlinear:
    individual: false
    learning_rate: 0.005
    batch_size: 128
    epochs: 15
    patience: 4
