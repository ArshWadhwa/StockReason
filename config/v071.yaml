# StockReason v0.7.1 System Configuration
# Skeptical Audit & Reproducible Cross-Sectional Evaluation
version: "0.7.1"

# Reproducibility Seeds
seeds: [42, 101, 2024, 7, 999]
tree_seeds: [42, 101, 2024]
neural_seeds: [42, 101, 2024, 7, 999]

# Lockbox Specification
lockbox:
  start_date: "2026-03-09"
  end_date: "2026-09-07"
  trading_days: 127
  embargo_start_date: "2026-01-29"
  embargo_end_date: "2026-03-06"
  embargo_trading_days: 26
  trainable_start_date: "2021-11-18"
  trainable_end_date: "2026-01-28"
  trainable_trading_days: 1038

# Cross-Validation Protocol
cv:
  n_folds: 8
  min_train_ratio: 0.40
  val_ratio: 0.10
  test_ratio: 0.10
  purge_window: 21
  embargo_window: 5

# Horizontally Matched Horizons
horizons: [5, 21]

# Bootstrap Settings
bootstrap:
  n_replications: 5000
  block_lengths: [10, 21, 42]
  default_block_length: 21
  confidence_level: 0.95

# Frozen Model Configurations (chosen strictly on validation folds)
frozen_models:
  ridge:
    alpha: 10.0
    fit_intercept: true
  lightgbm:
    n_estimators: 250
    learning_rate: 0.03
    num_leaves: 31
    min_child_samples: 20
    subsample: 0.8
    colsample_bytree: 0.8
    early_stopping_rounds: 20
    random_state: 42
    n_jobs: 1
  catboost:
    iterations: 250
    learning_rate: 0.03
    depth: 5
    l2_leaf_reg: 3.0
    early_stopping_rounds: 20
    random_seed: 42
    thread_count: 1
    verbose: 0
  lstm:
    hidden_dim: 32
    num_layers: 2
    dropout: 0.2
    learning_rate: 0.002
    batch_size: 128
    epochs: 15
    patience: 4
  gru:
    hidden_dim: 32
    num_layers: 2
    dropout: 0.2
    learning_rate: 0.002
    batch_size: 128
    epochs: 15
    patience: 4
  dlinear:
    individual: false
    learning_rate: 0.005
    batch_size: 128
    epochs: 15
    patience: 4

# Verified Cost Structure (Indian Equity Delivery)
costs:
  brokerage_pct: 0.0003          # 0.03% or ₹20 flat
  brokerage_flat_cap: 20.0       # ₹20 max per executed order
  stt_pct: 0.0010                # 0.1% on delivery buy & sell
  exchange_txn_pct: 0.0000345    # 0.00345% NSE cash market turnover
  sebi_turnover_pct: 0.000001    # 0.0001% (₹10 / crore)
  stamp_duty_pct: 0.00015        # 0.015% on buy side only
  gst_pct: 0.18                  # 18% GST on (brokerage + exchange + sebi)
  dp_charges_per_sell: 15.93     # ₹13.50 + 18% GST CDSL depository charge per sell
  slippage_bps: 5.0              # 5 bps one-way baseline slippage
  cost_sensitivity_multipliers: [0.5, 1.0, 1.5, 2.0]

# Strategy Parameters (Horizon-Matched)
strategy:
  horizon_days: 21
  rebalance_freq: 21             # Every 21 trading days
  k_top: 10
  hysteresis_band: 20            # Exit when rank drops below 20
  min_trade_size_pct: 0.01       # 1% minimum portfolio weight change
  weight_drift_tolerance: 0.02   # 2% drift tolerance
  max_sector_weight: 0.30        # 30% sector cap
  max_stock_weight: 0.15         # 15% single-stock cap
  risk_free_rate: 0.065          # 6.5% RBI 91-day T-bill baseline
