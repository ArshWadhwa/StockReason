# StockReason v0.7 System Configuration
# Core specification shared across workstreams WS1 - WS10
version: "0.7.0-dev"

# Forecast & Modeling Parameters
horizons: [5, 21]
sequence_length: 60
embargo: 5

# Reproducibility Seeds
seeds: [0, 1, 2, 3, 4]

# Transaction Cost Parameters (Indian Equity Market - Delivery / Swing)
cost_parameters:
  brokerage: 0.0003        # 0.03% or flat rate ceiling
  stt: 0.001               # 0.1% Securities Transaction Tax (Delivery)
  exchange_charges: 0.0000345  # NSE turnover charge (0.00345%)
  sebi_turnover: 0.000001  # SEBI turnover fee (₹10 / crore)
  stamp_duty: 0.00015      # Stamp duty on buy side (0.015%)
  gst: 0.18                # 18% GST on (brokerage + exchange charges + sebi fees)
  slippage_bps: 5.0        # Assumed execution slippage in basis points (0.05%)

# Model Comparison & Deep Learning (WS4)
data:
  features_path: "data/processed/price_features.parquet"
  horizons:
    - "5d"
    - "21d"
  sequence_length: 60
  target_type: "excess_return" # excess over market (nifty_50)

cv:
  n_folds: 3
  val_ratio: 0.15
  test_ratio: 0.15
  purge_window: 21
  embargo_window: 5
  min_train_ratio: 0.40

models:
  - zero
  - market
  - ridge
  - elastic_net
  - lightgbm
  - catboost
  - lstm
  - gru
  - dlinear

deep_learning:
  hidden_dim: 32
  epochs: 15
  lr: 0.003
  patience: 4
  batch_size: 128
  n_seeds: 5

# Backtest Configuration (WS3)
backtest:
  initial_capital: 1000000.0
  rebalance_freq: "daily"
  horizon_days: 5
  risk_free_rate: 0.065 # 6.5% typical RBI 91-day T-bill yield
  top_k: 10
  sector_cap: 0.30

  costs:
    use_statutory_charges: true
    brokerage_pct: 0.0003       # 0.03%
    brokerage_flat_cap: 20.0    # ₹20 max per order
    stt_pct: 0.0010             # 0.1% on delivery buy and sell
    exchange_txn_pct: 0.0000345 # 0.00345% NSE turnover charge
    sebi_turnover_pct: 0.000001 # 0.0001% SEBI turnover fee
    stamp_duty_pct: 0.00015     # 0.015% on buy only
    gst_pct: 0.18               # 18% on (brokerage + txn + sebi)
    base_slippage_bps: 5.0      # 5 bps base slippage per side
    impact_factor: 0.1          # Liquidity participation impact

  execution:
    execution_time: "open"      # Strictly t+1 open
    stop_loss_pct: null         # Optional trailing or fixed stop-loss
    take_profit_pct: null       # Optional take-profit target
    limit_entry_pct: null       # Optional limit order offset

  benchmarks:
    nifty_50_symbol: "^NSEI"
    random_seeds: 200

# Canonical Output and Data Paths
paths:
  data_dir: "data/v0.7"
  artifacts_dir: "artifacts/v0.7"
  reports_dir: "reports/v0.7"
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  price_features_parquet: "data/processed/price_features.parquet"
  price_features_csv: "data/processed/price_features.csv"
  sentiment_features_parquet: "data/processed/sentiment_features.parquet"
  sentiment_features_csv: "data/processed/sentiment_features.csv"
  predictions_json: "data/processed/predictions.json"
  predictions_dir: "artifacts/v0.7/predictions"
  results_json: "artifacts/v0.7/comparison_results.json"
  report_ws4: "reports/v0.7/WS4_report.md"
  report_comparison: "reports/v0.7/model_comparison.md"

# Freshness Limits (in trading days)
freshness:
  max_stale_trading_days: 3
